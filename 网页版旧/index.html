<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>发票助手</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #eef1f6; color: #24292f; font-size: 14px;
    display: grid; grid-template-rows: 50px 1fr;
    overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  header {
    background: linear-gradient(90deg, #1f6feb, #3a86ff);
    color: #fff; display: flex; align-items: center; gap: 14px;
    padding: 0 18px; box-shadow: 0 2px 8px rgba(31,111,235,.28);
    z-index: 2;
  }
  header b { font-size: 16px; letter-spacing: .5px; }
  header .dot { width: 7px; height: 7px; border-radius: 50%; background: #b4ff9d;
                box-shadow: 0 0 6px #b4ff9d; }
  header #folderName {
    font-size: 12.5px; background: rgba(255,255,255,.16); padding: 3px 10px;
    border-radius: 20px; max-width: 46vw; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  header .sum { margin-left: auto; font-size: 13px; opacity: .97;
                background: rgba(255,255,255,.14); padding: 5px 14px;
                border-radius: 20px; }
  header .sum b { font-size: 15px; }

  main {
    display: grid; grid-template-columns: 352px 1fr;
    gap: 14px; padding: 14px; min-height: 0;
  }
  .panel {
    background: #fff; border-radius: 10px;
    box-shadow: 0 1px 4px rgba(20,40,80,.10), 0 0 0 1px rgba(20,40,80,.04);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .panel h3 {
    margin: 0; padding: 11px 14px; font-size: 14px;
    border-bottom: 1px solid #edf0f4; display: flex; align-items: center; gap: 8px;
    color: #1c2430;
  }
  .panel h3::before {
    content: ""; width: 4px; height: 15px; border-radius: 2px;
    background: linear-gradient(180deg, #1f6feb, #5aa9ff);
  }
  .panel h3 .sp { color: #8a9199; font-weight: normal; font-size: 12px; }

  button {
    padding: 6px 12px; border: 0; border-radius: 7px;
    background: linear-gradient(180deg, #2f7dff, #1f6feb);
    color: #fff; cursor: pointer; font-size: 13px; white-space: nowrap;
    box-shadow: 0 1px 2px rgba(31,111,235,.35); transition: .12s;
  }
  button:hover { filter: brightness(1.07); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.ghost {
    background: #fff; color: #33404f; box-shadow: inset 0 0 0 1px #d7dee7;
  }
  button.ghost:hover { background: #f3f7ff; box-shadow: inset 0 0 0 1px #9dc0ff; }
  button.tiny { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
  button[disabled] { opacity: .5; cursor: default; transform: none; }

  /* ---------- 左侧 ---------- */
  .folderbar { padding: 11px 12px 6px; display: flex; gap: 7px; }
  .folderbar button { flex: 1; }
  .leftbar { padding: 5px 12px 9px; display: flex; gap: 7px; align-items: center; }
  .leftbar button { flex: 1; }
  .cnt { margin-left: auto; color: #8a9199; font-size: 12px;
         background: #f1f4f8; border-radius: 12px; padding: 2px 9px; }
  .folderbar .cnt { margin-left: 0; }

  .filelist { overflow: auto; padding: 3px 8px 12px; flex: 1; min-height: 0; }
  .filelist.dropzone { outline: 2px dashed #1f6feb; outline-offset: -4px;
                       background: #eef5ff; border-radius: 8px; }
  .frow {
    display: flex; align-items: center; gap: 7px; padding: 7px 8px;
    border-radius: 8px; border: 1px solid transparent; cursor: pointer;
    transition: .1s; margin-bottom: 2px;
  }
  .frow:hover { background: #f5f8fd; border-color: #e2e9f3; }
  .frow.cur { background: linear-gradient(90deg, #eaf2ff, #f4f8ff);
              border-color: #9dc0ff; }
  .frow .ico { flex: none; opacity: .55; font-size: 13px; }
  .frow .nm {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 13px; color: #33404f;
  }
  .frow .amt { font-variant-numeric: tabular-nums; font-size: 13px; color: #1a7f37; }
  .frow .amt.bad { color: #cf222e; }
  .frow .amt.wait { color: #b1b6bb; }
  .frow .del {
    border: 0; background: transparent; color: #b1b6bb; cursor: pointer;
    font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 5px;
  }
  .frow .del:hover { background: #ffe9e6; color: #cf222e; }
  .badge {
    font-size: 11px; padding: 2px 7px; border-radius: 10px; flex: none;
    background: #dafbe1; color: #1a7f37; border: 1px solid #b7f0c6;
  }
  .badge.off { background: #f1f4f8; color: #8a9199; border-color: #e3e8ee; }
  .hint { padding: 18px 15px; color: #8a9199; font-size: 13px; line-height: 2.1; }
  .hint b { color: #1f6feb; font-weight: 600; }
  .hint .step { display: flex; gap: 8px; }
  .hint .step i {
    font-style: normal; width: 19px; height: 19px; border-radius: 50%;
    background: #eaf2ff; color: #1f6feb; font-size: 12px; flex: none;
    display: flex; align-items: center; justify-content: center;
    margin-top: 5px; font-weight: bold;
  }
  .others { padding: 5px 13px 11px; color: #9aa0a6; font-size: 12px;
            border-top: 1px dashed #edf0f4; }

  /* ---------- 右侧: 上预览 / 下明细 ---------- */
  .right { display: grid; grid-template-rows: minmax(240px, 46%) 1fr;
           gap: 14px; min-height: 0; }

  .pvbar {
    display: flex; align-items: center; gap: 12px; padding: 9px 14px;
    border-bottom: 1px solid #edf0f4; background: #fbfcfe;
  }
  .pvbar .fn {
    font-size: 13px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 1; color: #33404f; font-weight: 600;
  }
  .pvbar .zoomctl { display: flex; align-items: center; gap: 9px; }
  .pvbar .zoomctl label { font-size: 11.5px; color: #8a9199; }
  #zSlider { -webkit-appearance: none; appearance: none;
             width: 150px; height: 5px; border-radius: 5px;
             background: linear-gradient(90deg, #1f6feb var(--p,25%), #dde3ea var(--p,25%));
             outline: none; cursor: pointer; }
  #zSlider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 15px; height: 15px;
    border-radius: 50%; background: #fff; border: 2px solid #1f6feb;
    box-shadow: 0 1px 4px rgba(31,111,235,.45); cursor: grab;
  }
  #zSlider::-webkit-slider-thumb:active { cursor: grabbing; }
  .zval {
    font-size: 12px; color: #1f6feb; background: #eaf2ff;
    border-radius: 12px; padding: 2px 9px; min-width: 48px;
    text-align: center; font-variant-numeric: tabular-nums;
  }

  .pvbody {
    flex: 1; min-height: 0; overflow: auto; position: relative;
    background: #33383f; cursor: grab;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .pvbody.panning { cursor: grabbing; }
  .pvbody::-webkit-scrollbar { width: 13px; height: 13px; }
  .pvbody::-webkit-scrollbar-thumb { background: #6b727b; border-radius: 7px;
    border: 3px solid transparent; background-clip: content-box; }
  .pvbody::-webkit-scrollbar-thumb:hover { background: #8a929c;
    background-clip: content-box; border: 3px solid transparent; }
  .pvbody::-webkit-scrollbar-corner { background: transparent; }
  .pvcanvas {
    width: max-content; margin: 0 auto; padding: 18px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .pvcanvas img {
    display: block; background: #fff; user-select: none; -webkit-user-drag: none;
    box-shadow: 0 4px 18px rgba(0,0,0,.45); border-radius: 2px;
  }
  .pvempty, .pvload {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #aeb4bc; gap: 8px;
    pointer-events: none; text-align: center;
  }
  .pvempty .big { font-size: 40px; filter: grayscale(.3); }
  .pvload { color: #cfd4da; }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.18); border-top-color: #6ea8ff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 报销明细 ---------- */
  .totbar {
    display: flex; gap: 10px; padding: 11px 14px; background: #f7f9fc;
    border-bottom: 1px solid #edf0f4; flex-wrap: wrap;
  }
  .kpi {
    background: #fff; border: 1px solid #e6ebf2; border-radius: 8px;
    padding: 6px 15px; min-width: 118px;
    box-shadow: 0 1px 2px rgba(20,40,80,.05);
  }
  .kpi .k { font-size: 11px; color: #8a9199; display: block; margin-bottom: 2px; }
  .kpi .v { font-size: 16px; font-weight: 700; color: #1c2430;
            font-variant-numeric: tabular-nums; }
  .kpi.accent .v { color: #1f6feb; }
  .kpi.green .v { color: #1a7f37; }
  .tablewrap { overflow: auto; min-height: 0; flex: 1; }
  .tablewrap.dz { outline: 2px dashed #1f6feb; outline-offset: -6px;
                  background: #eef5ff; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; background: #f7f9fc; text-align: left;
    padding: 9px 11px; font-size: 12px; color: #57606a; font-weight: 600;
    border-bottom: 1px solid #e6ebf2; white-space: nowrap; z-index: 1;
  }
  tbody td { padding: 8px 11px; border-bottom: 1px solid #f1f3f6; }
  tbody tr:nth-child(even) { background: #fafbfd; }
  tbody tr:hover { background: #eef5ff; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .neg { color: #cf222e; }
  .src { color: #8a9199; font-size: 12px; max-width: 220px;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
         cursor: pointer; }
  .src:hover { color: #1f6feb; text-decoration: underline; }
  tfoot td {
    position: sticky; bottom: 0; background: #fffdf3; font-weight: 700;
    border-top: 2px solid #e3b341; padding: 10px 11px;
  }
  .empty { padding: 30px; color: #8a9199; text-align: center; line-height: 1.9; }
  .toolbar { display: flex; gap: 8px; margin-left: auto; }
</style>
</head>
<body>
<header>
  <b>🧾 发票助手</b>
  <span class="dot"></span>
  <span id="folderName">未打开文件夹</span>
  <span class="sum" id="headSum">报销 0 张 ｜ 价税合计 <b>0.00</b></span>
</header>

<main>
  <!-- ============ 左侧: 选文件、加报销、删除 ============ -->
  <section class="panel">
    <h3>文件<span class="sp">单击看原件 · 拖文件进来即加入报销</span></h3>
    <div class="folderbar">
      <button class="ghost" id="btnPick">📂 选择文件夹</button>
      <button class="ghost" id="btnAddFile">＋选择文件</button>
      <span class="cnt" id="leftCnt">0 个</span>
    </div>
    <div class="leftbar">
      <button id="btnAll">全部加入</button>
      <button class="ghost" id="btnAllOut">全部移出</button>
    </div>
    <input type="file" id="dirInput" webkitdirectory hidden />
    <input type="file" id="fileInput" accept=".pdf" multiple hidden />
    <div class="filelist" id="fileList"></div>
    <div class="others" id="others" style="display:none"></div>
  </section>

  <!-- ============ 右侧: 上预览 / 下报销明细 ============ -->
  <section class="right">
    <div class="panel">
      <div class="pvbar">
        <span class="fn" id="pvName">发票原件</span>
        <div class="zoomctl">
          <label>缩放</label>
          <input type="range" id="zSlider" min="25" max="400" step="5" value="100" />
          <span class="zval" id="zVal">100%</span>
        </div>
      </div>
      <div class="pvbody" id="pvBody">
        <div class="pvcanvas" id="pvCanvas"></div>
        <div class="pvload" id="pvLoad" style="display:none">
          <div class="spinner"></div><div>正在加载发票…</div>
        </div>
        <div class="pvempty" id="pvEmpty">
          <div class="big">📄</div>
          <div>单击左侧文件，在这里查看发票原件</div>
          <div style="font-size:12px">滚轮缩放 · 按住左键拖动 · 右侧滑块调缩放</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>报销明细<span class="sp" id="itemCount">0 项</span>
        <span class="toolbar">
          <button class="ghost" id="btnByItem">按商品汇总</button>
          <button class="ghost" id="btnClear">清空报销</button>
          <button id="btnCsv">导出 CSV</button>
        </span>
      </h3>
      <div class="totbar">
        <div class="kpi"><span class="k">金额(不含税)</span><span class="v" id="tAmt">0.00</span></div>
        <div class="kpi"><span class="k">税额</span><span class="v" id="tTax">0.00</span></div>
        <div class="kpi accent"><span class="k">价税合计</span><span class="v" id="tTot">0.00</span></div>
        <div class="kpi green"><span class="k">发票张数</span><span class="v" id="tInv">0</span></div>
        <div class="kpi"><span class="k">明细行数</span><span class="v" id="tRows">0</span></div>
      </div>
      <div class="tablewrap" id="tableWrap">
        <table>
          <thead>
            <tr>
              <th style="width:23%">商品名称</th>
              <th>规格型号</th>
              <th class="num">数量</th>
              <th class="num">单价</th>
              <th class="num">金额</th>
              <th class="num">税率</th>
              <th class="num">税额</th>
              <th class="num">价税合计</th>
              <th>来源</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
          <tfoot id="tfoot" style="display:none">
            <tr>
              <td colspan="4">合计</td>
              <td class="num" id="fAmt">0.00</td>
              <td></td>
              <td class="num" id="fTax">0.00</td>
              <td class="num" id="fTot">0.00</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const state = { files: [], preview: null, byItem: false, zoom: 1 };
let seq = 0;

const HINT = `<div class="hint">
  <div class="step"><i>1</i><div>点<b>选择文件夹</b>，里面的 PDF 全部列出</div></div>
  <div class="step"><i>2</i><div><b>单击文件</b>：右上角查看发票原件</div></div>
  <div class="step"><i>3</i><div>点<b>加入</b>放进报销明细，点 <b>×</b> 删除</div></div>
  <div class="step"><i>4</i><div>把桌面上的 PDF 直接拖进这个列表也行</div></div>
</div>`;

/* ================= 左侧文件 ================= */
function pushFile(name, path, join, blob) {
  const size = blob ? blob.size : -1;
  const dup = state.files.find(f => f.name === name &&
    (f.size === size || f.size === -1 || size === -1));
  if (dup) { if (join && !dup.inReimb) joinReimb(dup); return dup; }
  const f = { id: ++seq, name, size, path: path || null, blob: blob || null,
              inReimb: false, inv: null };
  state.files.push(f);
  if (join) joinReimb(f);
  return f;
}

async function ensurePath(f) {
  if (f.path) return f.path;
  const r = await fetch('/api/save?name=' + encodeURIComponent(f.name),
    { method: 'POST', body: f.blob });
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  f.path = d.path;
  return f.path;
}

async function joinReimb(f) {
  if (f.inReimb) return;
  try {
    const p = await ensurePath(f);
    const r = await fetch('/api/parse', { method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ paths: [p] }) });
    const list = await r.json();
    f.inv = list[0] || null;
    f.inReimb = true;
  } catch (e) {
    f.inv = { 文件名: f.name, 金额: null, 税额: null, 价税合计: null,
              备注: '失败: ' + e.message, 明细: [] };
    f.inReimb = true;
  }
  render();
}
function leaveReimb(f) { f.inReimb = false; render(); }
function removeFile(f) {
  state.files = state.files.filter(x => x !== f);
  if (state.preview === f.id) clearPreview();
  render();
}

function renderFiles() {
  const el = $('fileList');
  el.innerHTML = '';
  if (!state.files.length) { el.innerHTML = HINT; }
  state.files.forEach(f => {
    const row = document.createElement('div');
    row.className = 'frow' + (state.preview === f.id ? ' cur' : '');
    row.draggable = true;

    const ico = document.createElement('span');
    ico.className = 'ico'; ico.textContent = '📄';
    row.appendChild(ico);

    const nm = document.createElement('span');
    nm.className = 'nm'; nm.textContent = f.name; nm.title = f.name;
    row.appendChild(nm);

    if (f.inReimb) {
      const b = document.createElement('span');
      b.className = 'badge'; b.textContent = '报销';
      row.appendChild(b);
      const a = document.createElement('span');
      a.className = 'amt' + (f.inv && f.inv.价税合计 == null ? ' bad' : '');
      a.textContent = f.inv && f.inv.价税合计 != null ? f.inv.价税合计.toFixed(2) : '失败';
      row.appendChild(a);
      const t = document.createElement('button');
      t.className = 'tiny'; t.textContent = '移出';
      t.title = '从报销明细移出(文件保留在列表)';
      t.onclick = e => { e.stopPropagation(); leaveReimb(f); };
      row.appendChild(t);
    } else {
      const a = document.createElement('span');
      a.className = 'amt wait'; a.textContent = '未加入';
      row.appendChild(a);
      const t = document.createElement('button');
      t.className = 'tiny ghost'; t.textContent = '加入';
      t.onclick = e => { e.stopPropagation(); joinReimb(f); };
      row.appendChild(t);
    }

    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '×'; del.title = '删除此文件';
    del.onclick = e => { e.stopPropagation(); removeFile(f); };
    row.appendChild(del);

    row.onclick = () => showPreview(f);
    row.ondragstart = e => {
      e.dataTransfer.setData('text/fpid', String(f.id));
      e.dataTransfer.effectAllowed = 'copy';
    };
    el.appendChild(row);
  });
  $('leftCnt').textContent = state.files.length + ' 个';
}

const fl = $('fileList');
['dragenter', 'dragover'].forEach(ev =>
  fl.addEventListener(ev, e => {
    if (![...(e.dataTransfer.items||[])].some(i => i.kind === 'file')) return;
    e.preventDefault(); fl.classList.add('dropzone');
  }));
fl.addEventListener('dragleave', e => {
  if (e.target === fl) fl.classList.remove('dropzone');
});
fl.addEventListener('drop', e => {
  e.preventDefault(); fl.classList.remove('dropzone');
  if (e.dataTransfer.getData('text/fpid')) return;
  [...(e.dataTransfer.files || [])]
    .filter(f => f.name.toLowerCase().endsWith('.pdf'))
    .forEach(f => pushFile(f.name, null, true, f));
  render();
});

/* ================= 右上: 预览 (滚轮缩放 / 拖动平移 / 滚动条 / 滑块) ================= */
const pvBody = $('pvBody'), pvCanvas = $('pvCanvas');
let pvPath = null, pvPages = [], pvImgs = [], pvFit = 1, pvTimer = 0;

async function showPreview(f) {
  state.preview = f.id;
  $('pvName').textContent = f.name;
  renderFiles(); renderDetail();
  clearCanvas();
  $('pvEmpty').style.display = 'none';
  $('pvLoad').style.display = '';
  const myId = f.id;
  try {
    const p = await ensurePath(f);
    const r = await fetch('/api/pages?path=' + encodeURIComponent(p));
    const d = await r.json();
    if (state.preview !== myId) return;          // 已切换到别的文件
    pvPath = p; pvPages = d.pages || [];
    state.zoom = 1; pvBody.scrollLeft = 0; pvBody.scrollTop = 0;
    layoutPages();
    $('pvLoad').style.display = 'none';
    if (!pvPages.length) { $('pvEmpty').style.display = ''; }
  } catch (e) {
    if (state.preview !== myId) return;
    $('pvLoad').style.display = 'none';
    $('pvEmpty').style.display = '';
    $('pvEmpty').querySelector('div:nth-child(2)').textContent = '无法打开: ' + e.message;
  }
}

function clearCanvas() {
  pvCanvas.innerHTML = ''; pvImgs = []; pvPages = []; pvPath = null;
}

function clearPreview() {
  state.preview = null;
  clearPreviewUI();
}
function clearPreviewUI() {
  clearCanvas();
  $('pvEmpty').style.display = '';
  $('pvEmpty').querySelector('div:nth-child(2)').textContent = '单击左侧文件，在这里查看发票原件';
  $('pvLoad').style.display = 'none';
  $('pvName').textContent = '发票原件';
  setZoom(1, true);
}

/* 按容器宽度算"适合宽度"的基准缩放 */
function layoutPages() {
  if (!pvPages.length) return;
  const avail = pvBody.clientWidth - 36;
  const maxW = Math.max(...pvPages.map(p => p.w));
  pvFit = Math.max(0.1, avail / maxW);
  pvImgs = pvPages.map((p, i) => {
    const img = document.createElement('img');
    img.draggable = false;
    pvCanvas.appendChild(img);
    return img;
  });
  updateSizes();
  scheduleSrc();
}

function updateSizes() {
  pvImgs.forEach((img, i) => {
    const p = pvPages[i];
    img.style.width = (p.w * pvFit * state.zoom) + 'px';
  });
}

/* 仅在缩放稳定后才重新请求高清图 (期间旧图仍在显示) */
function scheduleSrc() {
  clearTimeout(pvTimer);
  pvTimer = setTimeout(refreshSrc, 160);
}
function refreshSrc() {
  if (!pvPath || !pvImgs.length) return;
  const dpr = window.devicePixelRatio || 1;
  pvImgs.forEach((img, i) => {
    const p = pvPages[i];
    const z = Math.max(0.2, Math.min(4, pvFit * state.zoom * dpr));
    const url = '/api/pageimg?path=' + encodeURIComponent(pvPath) +
                '&page=' + i + '&zoom=' + z.toFixed(2);
    if (img.dataset.url !== url) { img.dataset.url = url; img.src = url; }
  });
}

function setZoom(z, silent, ax, ay) {
  z = Math.max(0.25, Math.min(4, z));
  const old = state.zoom;
  if (z === old && !silent) return;
  // 以 (ax,ay) 视口坐标为锚点保持位置
  const hasAnchor = !silent && ax != null;
  const bx = hasAnchor ? (pvBody.scrollLeft + ax) / old : 0;
  const by = hasAnchor ? (pvBody.scrollTop + ay) / old : 0;
  state.zoom = z;
  updateSizes();
  if (hasAnchor) {
    pvBody.scrollLeft = bx * z - ax;
    pvBody.scrollTop = by * z - ay;
  }
  syncZoomUI();
  if (!silent) scheduleSrc();
}
function syncZoomUI() {
  const pct = Math.round(state.zoom * 100);
  $('zVal').textContent = pct + '%';
  $('zSlider').value = pct;
  $('zSlider').style.setProperty('--p', ((pct - 25) / (400 - 25) * 100) + '%');
}

/* 滚轮: 以光标为中心缩放 */
pvBody.addEventListener('wheel', e => {
  if (!pvImgs.length) return;
  e.preventDefault();
  const r = pvBody.getBoundingClientRect();
  const f = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  setZoom(state.zoom * f, false, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

/* 按住左键拖动平移 (点在滚动条上时交给浏览器) */
let pan = null;
pvBody.addEventListener('mousedown', e => {
  if (e.button !== 0 || !pvImgs.length) return;
  const r = pvBody.getBoundingClientRect();
  if (e.clientX - r.left >= pvBody.clientWidth ||
      e.clientY - r.top >= pvBody.clientHeight) return;   // 滚动条区域
  pan = { x: e.clientX, y: e.clientY,
          sl: pvBody.scrollLeft, st: pvBody.scrollTop };
  pvBody.classList.add('panning');
  e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!pan) return;
  pvBody.scrollLeft = pan.sl - (e.clientX - pan.x);
  pvBody.scrollTop  = pan.st - (e.clientY - pan.y);
});
window.addEventListener('mouseup', () => {
  pan = null; pvBody.classList.remove('panning');
});

/* 滑块缩放 (以视口中心为锚) */
$('zSlider').addEventListener('input', e => {
  const z = Number(e.target.value) / 100;
  setZoom(z, false, pvBody.clientWidth / 2, pvBody.clientHeight / 2);
});

/* 容器尺寸变化 → 重新适配宽度 */
let rzTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => {
    if (!pvPages.length) return;
    const avail = pvBody.clientWidth - 36;
    const maxW = Math.max(...pvPages.map(p => p.w));
    pvFit = Math.max(0.1, avail / maxW);
    updateSizes(); scheduleSrc();
  }, 200);
});

/* 拖文件到预览区也可加入报销 */
['dragenter', 'dragover'].forEach(ev =>
  pvBody.addEventListener(ev, e => { e.preventDefault(); }));
pvBody.addEventListener('drop', e => {
  e.preventDefault();
  const pid = e.dataTransfer.getData('text/fpid');
  if (pid) { const f = byId(+pid); if (f && !f.inReimb) joinReimb(f); return; }
  [...(e.dataTransfer.files || [])]
    .filter(f => f.name.toLowerCase().endsWith('.pdf'))
    .forEach(f => pushFile(f.name, null, true, f));
  render();
});
function byId(id) { return state.files.find(f => f.id === id); }

/* ================= 右下: 报销明细 ================= */
function reimbFiles() { return state.files.filter(f => f.inReimb); }
function rowsFlat() {
  const out = [];
  reimbFiles().forEach(f => (f.inv.明细 || []).forEach(it =>
    out.push(Object.assign({ src: f.name, inv: f.inv }, it))));
  return out;
}
function rowsGrouped() {
  const map = new Map();
  rowsFlat().forEach(r => {
    const k = (r.名称 || '').replace(/\s+/g, '');
    if (!map.has(k)) map.set(k, { 名称: r.名称, 规格: '', 数量: 0, 单价: null,
                                  金额: 0, 税率: r.税率, 税额: 0, src: '', n: 0 });
    const g = map.get(k);
    g.金额 = Math.round((g.金额 + (r.金额 || 0)) * 100) / 100;
    g.税额 = Math.round((g.税额 + (r.税额 || 0)) * 100) / 100;
    g.数量 = Math.round((g.数量 + (r.数量 || 0)) * 100) / 100;
    g.n++;
    if (!g.规格 && r.规格) g.规格 = r.规格;
    if (g.n === 1) { g.单价 = r.单价; g.src = r.src; } else g.src = '';
  });
  return [...map.values()].sort((a, b) => b.金额 - a.金额);
}
function fmt(n) { return n == null ? '' : Number(n).toFixed(2); }

function renderDetail() {
  const rows = state.byItem ? rowsGrouped() : rowsFlat();
  const tb = $('tbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="9" class="empty">' +
      (reimbFiles().length ? '这些发票里没有解析到商品明细'
                           : '还没有加入报销的发票<br>在左侧点「加入」，或把 PDF 拖进左侧') +
      '</td></tr>';
    $('tfoot').style.display = 'none';
  } else {
    tb.innerHTML = rows.map(r => {
      const tot = (r.金额 != null && r.税额 != null) ? r.金额 + r.税额 : null;
      const cls = r.金额 < 0 ? ' class="neg"' : '';
      return '<tr>' +
        `<td>${esc(r.名称 || '')}</td>` +
        `<td>${esc(r.规格 || '')}</td>` +
        `<td class="num">${r.数量 ?? ''}</td>` +
        `<td class="num">${fmt(r.单价)}</td>` +
        `<td class="num"${cls}>${fmt(r.金额)}</td>` +
        `<td class="num">${esc(r.税率 || '')}</td>` +
        `<td class="num">${fmt(r.税额)}</td>` +
        `<td class="num">${tot == null ? '' : tot.toFixed(2)}</td>` +
        `<td class="src" data-src="${esc(r.src)}" title="点击查看原件">${esc(r.src || '')}</td>` +
        '</tr>';
    }).join('');
    $('tfoot').style.display = '';
    tb.querySelectorAll('.src').forEach(td => td.onclick = () => {
      const f = state.files.find(x => x.name === td.dataset.src);
      if (f) showPreview(f);
    });
  }

  let amt = 0, tax = 0, tot = 0, n = 0;
  reimbFiles().forEach(f => {
    if (f.inv && f.inv.价税合计 != null) {
      amt += f.inv.金额; tax += f.inv.税额; tot += f.inv.价税合计; n++;
    }
  });
  const fa = rows.reduce((s, r) => s + (r.金额 || 0), 0);
  const ft = rows.reduce((s, r) => s + (r.税额 || 0), 0);
  $('tAmt').textContent = amt.toFixed(2);
  $('tTax').textContent = tax.toFixed(2);
  $('tTot').textContent = tot.toFixed(2);
  $('tInv').textContent = n;
  $('tRows').textContent = rows.length;
  $('itemCount').textContent = rows.length + ' 项';
  $('headSum').innerHTML = `报销 <b>${n}</b> 张 ｜ 价税合计 <b>${tot.toFixed(2)}</b>`;
  $('fAmt').textContent = fa.toFixed(2);
  $('fTax').textContent = ft.toFixed(2);
  $('fTot').textContent = (fa + ft).toFixed(2);
}
function esc(s) { return String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function render() { renderFiles(); renderDetail(); }

const tw = $('tableWrap');
['dragenter', 'dragover'].forEach(ev =>
  tw.addEventListener(ev, e => {
    if (![...(e.dataTransfer.items||[])].some(i => i.kind === 'file')) return;
    e.preventDefault(); tw.classList.add('dz');
  }));
tw.addEventListener('dragleave', e => { if (e.target === tw) tw.classList.remove('dz'); });
tw.addEventListener('drop', e => {
  e.preventDefault(); tw.classList.remove('dz');
  const pid = e.dataTransfer.getData('text/fpid');
  if (pid) { const f = byId(+pid); if (f && !f.inReimb) joinReimb(f); return; }
  [...(e.dataTransfer.files || [])]
    .filter(f => f.name.toLowerCase().endsWith('.pdf'))
    .forEach(f => pushFile(f.name, null, true, f));
  render();
});

/* ================= 按钮 ================= */
$('btnPick').onclick = () => $('dirInput').click();
$('dirInput').onchange = e => {
  const fs = [...e.target.files];
  if (!fs.length) return;
  $('folderName').textContent = fs[0].webkitRelativePath.split('/')[0];
  fs.forEach(f => {
    if (f.name.toLowerCase().endsWith('.pdf')) pushFile(f.name, null, false, f);
  });
  const others = fs.filter(f => !f.name.toLowerCase().endsWith('.pdf'));
  if (others.length) {
    $('others').style.display = '';
    $('others').textContent = '其他文件 ' + others.length + ' 个: ' +
      others.slice(0, 6).map(f => f.name).join('、') + (others.length > 6 ? ' …' : '');
  }
  render();
  e.target.value = '';
};
$('btnAddFile').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  [...e.target.files].forEach(f => pushFile(f.name, null, true, f));
  render(); e.target.value = '';
};
$('btnAll').onclick = () => {
  state.files.filter(f => !f.inReimb).forEach(f => joinReimb(f));
};
$('btnAllOut').onclick = () => {
  state.files.forEach(f => f.inReimb = false);
  render();
};
$('btnClear').onclick = () => {
  state.files.forEach(f => f.inReimb = false);
  render();
};
$('btnByItem').onclick = e => {
  state.byItem = !state.byItem;
  e.target.textContent = state.byItem ? '按发票明细' : '按商品汇总';
  e.target.style.background = state.byItem ? '#1f6feb' : '#fff';
  e.target.style.color = state.byItem ? '#fff' : '#33404f';
  renderDetail();
};
$('btnCsv').onclick = () => {
  const rows = rowsFlat();
  if (!rows.length) { alert('还没有加入报销的发票'); return; }
  const head = ['来源文件','发票号码','开票日期','销售方','商品名称','规格型号',
                '数量','单价','金额(不含税)','税率','税额','价税合计','备注'];
  const lines = [head.join(',')];
  rows.forEach(r => {
    const v = r.inv;
    lines.push([r.src, v.发票号码, v.开票日期, v.销售方, r.名称, r.规格,
      r.数量 ?? '', r.单价 ?? '', fmt(r.金额), r.税率 || '', fmt(r.税额),
      r.金额 != null && r.税额 != null ? (r.金额 + r.税额).toFixed(2) : '',
      v.备注 || ''].map(csvCell).join(','));
  });
  const ta = rows.reduce((s, r) => s + (r.金额 || 0), 0);
  const tt = rows.reduce((s, r) => s + (r.税额 || 0), 0);
  lines.push(['合计','','','','','','','', ta.toFixed(2), '',
               tt.toFixed(2), (ta + tt).toFixed(2), ''].join(','));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')],
                        { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '报销商品明细_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
};
function csvCell(s) {
  s = String(s ?? '');
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

clearPreviewUI();
render();
</script>
</body>
</html>
