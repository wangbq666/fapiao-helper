name: Android APK

on:
  push:
    branches: [main]
    paths: ['android-app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK (Capacitor + Gradle)
        working-directory: android-app
        env:
          STORE_FILE: /tmp/keystore.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm ci || npm install
          npx cap sync android
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/keystore.jks
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload to v2.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/android/app/build/outputs/apk/release/app-release.apk /tmp/fapiao-mobile-v2.1.apk
          gh release upload v2.1 /tmp/fapiao-mobile-v2.1.apk --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: fapiao-apk
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
